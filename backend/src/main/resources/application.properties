spring.application.name=family-expense-tracker

# ---------- Server ----------
server.port=8080

# ---------- MySQL Datasource ----------
# CHANGE username/password below to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/family_expense_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=****
spring.datasource.password=****
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---------- JWT ----------
# Base64-encoded 256-bit secret. Change this in production.
jwt.secret=ZmFtaWx5LWV4cGVuc2UtdHJhY2tlci1zdXBlci1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy0yMDI1
jwt.expiration.ms=86400000

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.family.expensetracker=DEBUG
